<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iglesia</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: url('https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/IMG_8023.jpeg') no-repeat center center fixed;
      background-size: cover;
    }

    /* Evitar zoom en iOS al enfocar inputs */
    #content input,
    #content textarea,
    #content select,
    #content button {
      font-size: 16px;
    }

    .main-menu {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 22px; /* compacto */
      background-color: rgba(0, 0, 0, 0.5);
      padding: 16px;
      box-sizing: border-box;
      text-align: center;
    }

    /* Título del templo: azul oscuro + contorno blanco */
    .temple-title {
      max-width: 900px;
      color: #0b3d91;                 /* 🔵 azul oscuro */
      font-weight: 700;
      line-height: 1.2;
      margin: 4px 12px 6px;
      padding: 0 8px;
      -webkit-text-stroke: 1px #ffffff;
      text-shadow:
        0 0 1px #ffffff,
        0 0 2px #ffffff;
      font-size: clamp(18px, 3.2vw, 28px);
    }

    .main-menu button {
      font-size: 14px;                 /* un poco más pequeño */
      padding: 12px 18px;              /* un poco más pequeño */
      border-radius: 12px;
      color: white;
      cursor: pointer;
      background-color: rgba(0, 0, 0, 0.5);
      border: none;
      font-weight: bold;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }

    /* Logo flotante */
    .floating-logo {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 80px;
      height: auto;
      z-index: 1000;
      opacity: 0.9;
      animation: rotate 6s linear infinite;
      pointer-events: none;
    }

    @keyframes rotate {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }
  </style>
</head>
<body>

  <!-- MENÚ PRINCIPAL -->
  <div class="main-menu" id="mainMenu">

    <!-- 🏛️ Título del templo -->
    <h1 class="temple-title">
      Primera Iglesia Pentecostal de Jesucristo de Maunabo, P.R. Inc
    </h1>

    <button onclick="loadScript('https://dla-tech.github.io/PIPJM-PUBLIC-WE-/botones/programacion.js')">
      <span style="font-size: 34px;">📅</span><br>
      <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">Ver programación de Cultos</span>
    </button>

    <button onclick="loadScript('https://dla-tech.github.io/PIPJM-PUBLIC-WE-/botones/info.js')">
      <span style="font-size: 34px;">📜</span><br>
      <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">Info del templo y Congregación</span>
    </button>

    <button onclick="loadScript('https://dla-tech.github.io/PIPJM-PUBLIC-WE-/botones/peticiones.js')">
      <span style="font-size: 34px;">🙏</span><br>
      <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">Peticiones o Necesidad</span>
    </button>

    <button onclick="loadScript('https://dla-tech.github.io/PIPJM-PUBLIC-WE-/botones/vercultos.js')">
      <span style="font-size: 34px;">🎞️</span><br>
      <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">Ver cultos o En vivos</span>
    </button>
  </div>

  <!-- ÁREA PARA CARGAR LOS ARCHIVOS .JS -->
  <div id="content" style="display: none;"></div>

  <!-- FUNCIÓN PARA CARGAR ARCHIVO JS EXTERNO -->
  <script>
    function loadScript(url) {
      document.getElementById("mainMenu").style.display = "none";
      document.getElementById("content").style.display = "block";
      document.getElementById("content").innerHTML = ""; // limpiar antes
      const script = document.createElement('script');
      script.src = url;
      script.type = 'text/javascript';
      document.body.appendChild(script);
    }

    function volverAlMenu() {
      document.getElementById("content").style.display = "none";
      document.getElementById("mainMenu").style.display = "flex";
      document.getElementById("content").innerHTML = "";
    }
  </script>

  <!-- LOGO GIRATORIO -->
  <img src="https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/Logo%20de%20la%20iglesia%20PIPJM-2.png" alt="Logo PIPJM" class="floating-logo">
</body>
</html>
