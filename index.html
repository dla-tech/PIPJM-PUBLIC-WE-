<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Seleccione idioma</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      overflow: hidden;
      background:#fff;
      font-family: Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    body::before {
      content:"";
      position:fixed; inset:0;
      background:#fff;
      z-index:-1;
    }

    .gate {
      position:absolute; inset:0; min-height:100dvh;
      display:flex; flex-direction:column;
      justify-content:space-between;
      align-items:center;
      text-align:center;
      background:rgba(0,0,0,.45);
      box-sizing:border-box;
      padding:0 16px;
    }

    /* 🔥 LOGO CENTRADO */
    .center-logo {
      position: absolute;
      top: calc(45% - 30px);
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(260px, 100vmin, 540px);
      height: auto;
      display:block;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.25));
      z-index: 1;
      pointer-events: none;
      opacity: 0.96;
    }

    .outline {
      color:#0046ff;
      -webkit-text-stroke:1.8px #ffffff;
      paint-order:stroke fill;
      font-weight:700;
      text-shadow:
        2px 0 #fff, -2px 0 #fff,
        0 2px #fff, 0 -2px #fff,
        2px 2px #fff, -2px 2px #fff,
        2px -2px #fff, -2px -2px #fff;
    }

    h1 { margin:0; font-size:clamp(20px,4.5vw,28px); }

    .church-name {
      position: absolute;
      top: 4%;
      width: 90%;
      max-width: 800px;
      text-align: center;
      font-size: clamp(18px, 3.5vw, 26px);
      color: #0046ff;
      -webkit-text-stroke:1.8px #ffffff;
      font-weight:700;
      z-index: 2;
      line-height: 1.3;
      text-shadow:
        2px 0 #fff, -2px 0 #fff,
        0 2px #fff, 0 -2px #fff,
        2px 2px #fff, -2px 2px #fff,
        2px -2px #fff, -2px -2px #fff;
    }

    /* ÁREA PROMOS */
    .promo-area {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      padding-top: 80px;
      padding-bottom: 10px;
    }

    .promo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      width: 92%;
      max-width: 900px;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .promo-card {
      border-radius: 16px;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(0,0,0,0.45);
      background:transparent;
      cursor:pointer;
      position:relative;
      transition:transform 0.3s ease;
    }

    .promo-card img {
      width:100%;
      height:auto;
      max-height:220px;
      object-fit:cover;
      display:block;
      transition:transform 0.4s ease;
    }

    .promo-card p {
      margin:0;
      padding:6px 10px;
      background:rgba(0,0,0,0.55);
      color:#fff;
      font-weight:600;
      text-shadow:0 1px 3px rgba(0,0,0,0.7);
      font-size:13px;
    }

    /* BOTONES ABAJO */
    .lower-section {
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
      z-index:20;
      margin-bottom: 18px;
    }
    .btns {
      display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
    }
    .btn {
      display:inline-block; min-width:140px; padding:12px 18px;
      font-size:16px; font-weight:700; cursor:pointer; text-decoration:none;
      color:#f50505; -webkit-text-stroke:1.4px #fff; paint-order:stroke fill;
      background:rgba(255,204,0,100); border:2px solid #ffc107(255,255,255,.65);
      border-radius:12px; backdrop-filter:blur(2px);
      transition:transform .08s ease, background .15s ease;
    }
    .btn:hover { background:rgba(255,255,255,.28); }
    .btn:active { transform:scale(.98); }

    @media (max-width:600px){
      .promo-grid{ grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
      .promo-card img{ max-height:180px; }
    }

    /* 🧊 OVERLAY A PANTALLA COMPLETA PARA LA PROMO CLICADA */
    .promo-overlay {
      position: fixed;
      inset: 0;
      z-index: 999999; /* por encima de TODO */
      background: transparent; /* sin oscurecer el fondo */
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    .promo-overlay img {
      width: 100vw;
      height: 100vh;
      object-fit: contain; /* que no se deforme */
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      /* pequeña animación opcional */
      animation: pop 120ms ease-out;
    }
    @keyframes pop {
      from { transform: scale(.98); opacity: .9; }
      to   { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="gate">
    <div class="church-name outline">
      Primera Iglesia Pentecostal de Jesucristo de Maunabo, P.R. Inc.
    </div>

    <div class="promo-area">
      <div class="promo-grid" id="promoGrid"></div>
    </div>

    <img
      class="center-logo"
      src="https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/Logo%20de%20la%20iglesia%20PIPJM%20(8.5%20x%209%20in)%20(8.5%20x%2011%20in)%20(11%20x%2011%20in).png"
      alt="Logo PIPJM"
    >

    <div class="lower-section">
      <div class="btns">
        <button class="btn outline" onclick="goES()">Español</button>
        <button class="btn outline" onclick="goEN()">English</button>
      </div>
      <h1 class="outline">Seleccione idioma para continuar / Select language to continue </h1>
    </div>
  </div>

  <script>
    const promoGrid = document.getElementById("promoGrid");
    const jsonURL = "https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/Promo/Promos.json";

    // Cargar promos desde JSON
    fetch(jsonURL)
      .then(res => res.json())
      .then(promos => {
        const activas = promos.filter(p => p.active && p.imageUrl && p.imageUrl.trim() !== "");
        if (activas.length === 0) {
          promoGrid.style.display = "none";
          return;
        }
        activas.sort((a,b) => (a.order || 0) - (b.order || 0));
        promoGrid.innerHTML = activas.map(p => `
          <div class="promo-card" data-src="${p.imageUrl}">
            <img src="${p.imageUrl}" alt="Promo">
            <p>${p.title || "Evento"}</p>
          </div>
        `).join('');
      })
      .catch(err => console.error("Error cargando Promos.json:", err));

    // Al clic en una promo: abrir overlay con esa imagen a pantalla completa
    promoGrid.addEventListener("click", (e) => {
      const card = e.target.closest(".promo-card");
      if (!card) return;

      const src = card.getAttribute("data-src");
      if (!src) return;

      // Crear overlay
      const overlay = document.createElement("div");
      overlay.className = "promo-overlay";
      overlay.innerHTML = `<img src="${src}" alt="Promo ampliada">`;

      // Cerrar al tocar/clickear
      overlay.addEventListener("click", () => {
        overlay.remove();
        document.body.style.overflow = "hidden"; // mantener tu diseño sin scroll
      });

      // Mostrar
      document.body.appendChild(overlay);
      document.body.style.overflow = "hidden"; // bloquear scroll detrás
    });

    function goES(){ window.location.href = 'es/Index.html'; }
    function goEN(){ window.location.href = 'en/Index.html'; }
  </script>
</body>
</html>
