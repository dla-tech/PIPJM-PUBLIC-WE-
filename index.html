<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iglesia</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: url('https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/IMG_8023.jpeg') no-repeat center center fixed;
      background-size: cover;
    }

    /* Anti-zoom: asegura 16px en campos para que iOS no haga zoom automático */
    input, textarea, select {
      font-size: 16px;
    }

    .main-menu {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .main-menu button {
      font-size: 16px;
      padding: 16px 24px;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      background-color: rgba(0, 0, 0, 0.5);
      border: none;
      font-weight: bold;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
    }

    .floating-logo {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 80px;
      height: auto;
      z-index: 1000;
      opacity: 0.9;
      animation: rotate 6s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }
  </style>
</head>
<body>

  <!-- MENÚ PRINCIPAL -->
  <div class="main-menu" id="mainMenu">
    <button onclick="loadScript('https://dla-tech.github.io/PIPJM-PUBLIC-WE-/botones/programacion.js')">
      <span style="font-size: 40px;">📅</span><br>
      <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">Ver programación de Cultos</span>
    </button>

    <button onclick="loadScript('https://dla-tech.github.io/PIPJM-PUBLIC-WE-/botones/info.js')">
      <span style="font-size: 40px;">📜</span><br>
      <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">Info del templo y Congregación</span>
    </button>

    <button onclick="loadScript('https://dla-tech.github.io/PIPJM-PUBLIC-WE-/botones/peticiones.js')">
      <span style="font-size: 40px;">🙏</span><br>
      <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">Peticiones o Necesidad</span>
    </button>

    <button onclick="loadScript('https://dla-tech.github.io/PIPJM-PUBLIC-WE-/botones/vercultos.js')">
      <span style="font-size: 40px;">🎞️</span><br>
      <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">Ver cultos o En vivos</span>
    </button>
  </div>

  <!-- ÁREA PARA CARGAR LOS ARCHIVOS .JS -->
  <div id="content" style="display: none;"></div>

  <!-- FUNCIÓN PARA CARGAR ARCHIVO JS EXTERNO -->
  <script>
    function loadScript(url) {
      document.getElementById("mainMenu").style.display = "none";
      document.getElementById("content").style.display = "block";
      document.getElementById("content").innerHTML = ""; // limpiar antes
      const script = document.createElement('script');
      script.src = url;
      script.type = 'text/javascript';
      document.body.appendChild(script);
    }

    function volverAlMenu() {
      document.getElementById("content").style.display = "none";
      document.getElementById("mainMenu").style.display = "flex";
      document.getElementById("content").innerHTML = "";
    }
  </script>

  <!-- Anti-zoom móvil: bloquea el zoom al enfocar inputs y lo restaura al salir -->
  <script>
    (function () {
      const vp = document.querySelector('meta[name="viewport"]');
      if (!vp) return;
      const original = vp.getAttribute('content') || 'width=device-width, initial-scale=1.0';
      const locked = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no';
      let isLocked = false;

      const isTextInput = (el) => {
        if (!el) return false;
        const tag = el.tagName;
        if (tag === 'TEXTAREA') return true;
        if (tag !== 'INPUT') return false;
        const types = ['text','email','number','tel','search','password','url'];
        return types.includes((el.type || 'text').toLowerCase());
      };

      document.addEventListener('focusin', (e) => {
        if (isTextInput(e.target) && !isLocked) {
          vp.setAttribute('content', locked);
          isLocked = true;
        }
      });

      function restore() {
        if (isLocked) {
          vp.setAttribute('content', original);
          isLocked = false;
        }
      }

      document.addEventListener('focusout', () => setTimeout(restore, 200));

      // Si el usuario toca fuera de un input, intenta restaurar
      document.addEventListener('touchend',
