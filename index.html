<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Seleccione idioma</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      overflow: hidden; background:#000; font-family: Arial, sans-serif;
      -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    }
    /* Fondo full cover sin bordes */
    body::before{
      content:""; position:fixed; inset:0;
      background:url('https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/IMG_8023.jpeg') center/cover no-repeat;
      z-index:-1;
    }

    .gate{
      position:absolute; inset:0; min-height:100dvh;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      gap:18px; padding:16px; text-align:center; background:rgba(0,0,0,.45);
      box-sizing:border-box;
    }
    @supports not (height: 100dvh){ .gate{ min-height:100vh; } }

    /* Texto negro con contorno blanco 100% */
    .outline { color:#000; -webkit-text-stroke:1.6px #fff; paint-order:stroke fill; }
    @supports not (-webkit-text-stroke: 1px white){
      .outline{
        text-shadow:
          1px 0 #fff, -1px 0 #fff, 0 1px #fff, 0 -1px #fff,
          1px 1px #fff, -1px 1px #fff, 1px -1px #fff, -1px -1px #fff;
      }
    }
    h1{ margin:0 0 8px; font-size:clamp(20px,4.5vw,28px); }

    .btns{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
    .btn{
      display:inline-block; min-width:140px; padding:12px 18px;
      font-size:16px; font-weight:700; cursor:pointer; text-decoration:none;
      color:#000; -webkit-text-stroke:1.4px #fff; paint-order:stroke fill;
      background:rgba(255,255,255,.20); border:2px solid rgba(255,255,255,.65);
      border-radius:12px; backdrop-filter:blur(2px);
      transition:transform .08s ease, background .15s ease;
    }
    .btn:hover{ background:rgba(255,255,255,.28); }
    .btn:active{ transform:scale(.98); }
  </style>
</head>
<body>
  <div class="gate">
    <h1 class="outline">Seleccione idioma / Select language</h1>
    <div class="btns">
      <button class="btn outline" onclick="goES()">Español</button>
      <button class="btn outline" onclick="goEN()">English</button>
    </div>
  </div>

  <script>
    function goES(){ location.href = 'es/Index.html'; }
    function goEN(){ location.href = 'en/Index.html'; }
  </script>
</body>
</html>
