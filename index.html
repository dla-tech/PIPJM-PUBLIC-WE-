<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iglesia</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden; /* impide scrolleo */
      font-family: Arial, sans-serif;
    }

    .main-menu, .section {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f2f2f2;
    }

    .section {
      display: none;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    button {
      padding: 15px 25px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #0066cc;
      color: white;
    }

    .back-btn {
      margin-top: 30px;
      background-color: #333;
    }
  </style>
</head>
<body>

  <!-- Menú principal -->
  <div class="main-menu" id="mainMenu">
    <button onclick="showSection('programacion')">📅 Ver programación</button>
    <button onclick="showSection('info')">🏛️ Info del templo</button>
    <button onclick="showSection('peticion')">🙏 Petición o necesidad</button>
  </div>

  <!-- Sección: Programación -->
  <div class="section" id="programacion">
    <h2>📅 Programación semanal</h2>
    <p>Aquí puedes ver el calendario de cultos y actividades.</p>
    <button class="back-btn" onclick="goBack()">⬅️ Volver</button>
  </div>

  <!-- Sección: Info -->
  <div class="section" id="info">
    <h2>🏛️ Información del templo</h2>
    <p>Dirección, historia, pastores, horarios, etc.</p>
    <button class="back-btn" onclick="goBack()">⬅️ Volver</button>
  </div>

  <!-- Sección: Petición -->
  <div class="section" id="peticion">
    <h2>🙏 Petición o necesidad</h2>
    <p>Escribe tu petición y será atendida con oración.</p>
    <button class="back-btn" onclick="goBack()">⬅️ Volver</button>
  </div>

  <script>
    function showSection(id) {
      document.getElementById("mainMenu").style.display = "none";
      document.querySelectorAll('.section').forEach(sec => sec.style.display = 'none');
      document.getElementById(id).style.display = "flex";
    }

    function goBack() {
      document.querySelectorAll('.section').forEach(sec => sec.style.display = 'none');
      document.getElementById("mainMenu").style.display = "flex";
    }
  </script>

</body>
</html>
