<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Seleccione idioma</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background:#fff;
      font-family: Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    body::before {
      content:"";
      position:fixed; inset:0;
      background:#fff;
      z-index:-1;
    }

    .gate {
      position:relative;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      align-items:center;
      padding:16px;
      text-align:center;
      background:rgba(0,0,0,.45);
      box-sizing:border-box;
      gap:18px;
    }

    /* 🔥 LOGO CENTRADO (más grande y adaptativo) */
    .center-logo {
      margin-top: 40px;
      width: clamp(200px, 45vw, 540px);
      height: auto;
      display:block;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.25));
      z-index: 1;
      pointer-events: none;
      opacity: 0.96;
    }

    /* Texto azul con borde blanco */
    .outline {
      color:#0046ff;
      -webkit-text-stroke:1.8px #ffffff;
      paint-order:stroke fill;
      font-weight:700;
      text-shadow:
        2px 0 #fff, -2px 0 #fff,
        0 2px #fff, 0 -2px #fff,
        2px 2px #fff, -2px 2px #fff,
        2px -2px #fff, -2px -2px #fff;
    }

    h1 {
      margin:0;
      font-size:clamp(20px,4.5vw,28px);
    }

    /* 🔹 NOMBRE DE LA IGLESIA */
    .church-name {
      margin-top: 20px;
      width: 90%;
      max-width: 800px;
      text-align: center;
      font-size: clamp(18px, 3.5vw, 26px);
      color: #0046ff;
      -webkit-text-stroke:1.8px #ffffff;
      font-weight:700;
      z-index: 2;
      line-height: 1.3;
      text-shadow:
        2px 0 #fff, -2px 0 #fff,
        0 2px #fff, 0 -2px #fff,
        2px 2px #fff, -2px 2px #fff,
        2px -2px #fff, -2px -2px #fff;
    }

    .btns {
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
      margin-top:10px;
    }

    .btn {
      display:inline-block;
      min-width:140px;
      padding:12px 18px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      text-decoration:none;
      color:#0046ff;
      -webkit-text-stroke:1.4px #fff;
      paint-order:stroke fill;
      background:rgba(255,255,255,.20);
      border:2px solid rgba(255,255,255,.65);
      border-radius:12px;
      backdrop-filter:blur(2px);
      transition:transform .08s ease, background .15s ease;
    }

    .btn:hover { background:rgba(255,255,255,.28); }
    .btn:active { transform:scale(.98); }

    /* PROMO */
    .promo-banner {
      width:92%;
      max-width:780px;
      text-align:center;
      z-index:999;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 25px rgba(0,0,0,0.45);
      background:transparent;
      pointer-events:none;
      margin-top: 4%;
    }

    .promo-banner img {
      width:100%;
      height:auto;
      max-height:480px;
      object-fit:cover;
      display:block;
      border-radius:20px;
    }

    /* Sección inferior con botones */
    .lower-section {
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
      z-index:20;
      margin-top: 20px;
      margin-bottom: 30px;
    }

    /* 🔹 Responsividad adicional */
    @media (max-width: 768px) {
      .center-logo {
        width: clamp(180px, 70vw, 360px);
        margin-top: 30px;
      }
      .promo-banner img {
        max-height: 320px;
      }
      .lower-section {
        margin-top: 16px;
      }
    }

    @media (min-width: 1200px) {
      .center-logo {
        width: clamp(280px, 30vw, 620px);
      }
      .promo-banner img {
        max-height: 520px;
      }
    }
  </style>
</head>
<body>
  <div class="gate">
    <!-- 🕊️ Nombre de la iglesia -->
    <div class="church-name outline">
      Primera Iglesia Pentecostal de Jesucristo de Maunabo, P.R. Inc.
    </div>

    <!-- 🖼️ PROMO -->
    <div class="promo-banner" id="promoBanner"></div>

    <!-- 🔥 LOGO DE FONDO -->
    <img
      class="center-logo"
      src="https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/Logo%20de%20la%20iglesia%20PIPJM%20(8.5%20x%209%20in)%20(8.5%20x%2011%20in)%20(11%20x%2011%20in).png"
      alt="Logo PIPJM"
    >

    <!-- 🌍 BOTONES Y TEXTO -->
    <div class="lower-section">
      <div class="btns">
        <button class="btn outline" onclick="goES()">Español</button>
        <button class="btn outline" onclick="goEN()">English</button>
      </div>
      <h1 class="outline">Seleccione idioma / Select language</h1>
    </div>
  </div>

  <script>
    // 🔗 URL de la promo
    const promoUrl = "https://cdn.jsdelivr.net/gh/dla-tech/Media-privada@main/image000001.jpeg";
    const promoBanner = document.getElementById("promoBanner");

    if (promoUrl.trim() !== "") {
      promoBanner.innerHTML = '<img src="' + promoUrl + '" alt="Promo PIPJM">';
    } else {
      promoBanner.style.display = "none";
    }

    function goES(){ window.location.href = 'es/Index.html'; }
    function goEN(){ window.location.href = 'en/Index.html'; }
  </script>
</body>
</html>
