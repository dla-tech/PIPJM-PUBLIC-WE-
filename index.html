<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Seleccione idioma</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      overflow: hidden; background:#fff; font-family: Arial, sans-serif;
      -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    }

    body::before{
      content:""; position:fixed; inset:0;
      background:#fff;
      z-index:-1;
    }

    .gate{
      position:absolute; inset:0; min-height:100dvh;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      gap:18px; padding:16px; text-align:center; background:rgba(0,0,0,.45);
      box-sizing:border-box;
    }
    @supports not (height: 100dvh){ .gate{ min-height:100vh; } }

    .center-logo{
      width: clamp(160px, 45vmin, 360px);
      height: auto;
      display:block;
      margin: 0 auto 10px auto;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.15));
    }

    .outline { color:#000; -webkit-text-stroke:1.6px #fff; paint-order:stroke fill; }
    @supports not (-webkit-text-stroke: 1px white){
      .outline{
        text-shadow:
          1px 0 #fff, -1px 0 #fff, 0 1px #fff, 0 -1px #fff,
          1px 1px #fff, -1px 1px #fff, 1px -1px #fff, -1px -1px #fff;
      }
    }
    h1{ margin:0; font-size:clamp(20px,4.5vw,28px); }

    .btns{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
    .btn{
      display:inline-block; min-width:140px; padding:12px 18px;
      font-size:16px; font-weight:700; cursor:pointer; text-decoration:none;
      color:#000; -webkit-text-stroke:1.4px #fff; paint-order:stroke fill;
      background:rgba(255,255,255,.20); border:2px solid rgba(255,255,255,.65);
      border-radius:12px; backdrop-filter:blur(2px);
      transition:transform .08s ease, background .15s ease;
    }
    .btn:hover{ background:rgba(255,255,255,.28); }
    .btn:active{ transform:scale(.98); }

    /* PROMO */
    .promo-banner{
      position:absolute;
      top:5%;
      width:90%;
      max-width:750px;
      text-align:center;
      z-index:10;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 25px rgba(0,0,0,0.45);
      background:transparent;
    }

    .promo-banner img{
      width:100%;
      height:auto;
      display:block;
      border-radius:20px;
    }

    /* Botones y texto más abajo */
    .lower-section{
      margin-top:380px; /* 👈 bajado para que la promo no tape los botones */
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }

    @media (max-height:700px){
      .lower-section{ margin-top:320px; }
    }
  </style>
</head>
<body>
  <div class="gate">
    <!-- 🖼️ PROMO -->
    <div class="promo-banner" id="promoBanner">
      <!-- Si hay imagen, se inserta aquí -->
    </div>

    <!-- Logo -->
    <img
      class="center-logo"
      src="https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/Logo%20de%20la%20iglesia%20PIPJM%20(8.5%20x%209%20in)%20(8.5%20x%2011%20in)%20(11%20x%2011%20in).png"
      alt="Logo PIPJM"
    >

    <!-- Botones y texto -->
    <div class="lower-section">
      <div class="btns">
        <button class="btn outline" onclick="goES()">Español</button>
        <button class="btn outline" onclick="goEN()">English</button>
      </div>
      <h1 class="outline">Seleccione idioma / Select language</h1>
    </div>
  </div>

  <script>
    // 👉 Cambia esta URL o déjala vacía
    const promoUrl = "https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/image000001.jpeg";
    const promoBanner = document.getElementById("promoBanner");

    if (promoUrl.trim() !== "") {
      promoBanner.innerHTML = `<img src="${promoUrl}" alt="Promo PIPJM">`;
    } else {
      promoBanner.style.display = "none"; // desaparece si no hay imagen
    }

    function goES(){ location.href = 'es/Index.html'; }
    function goEN(){ location.href = 'en/Index.html'; }
  </script>
</body>
</html>
