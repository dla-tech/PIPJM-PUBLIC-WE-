<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iglesia</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/IMG_8023.jpeg') no-repeat center center fixed;
      background-size: cover;
    }

    .main-menu {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .main-menu button {
      font-size: 16px;
      padding: 16px 24px;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      background-color: rgba(0, 0, 0, 0.5);
      border: none;
      font-weight: bold;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
    }

    .section {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      width: 100vw;
      height: 100vh;
      text-align: center;
      position: absolute;
      top: 0;
      left: 0;
    }

    .back-btn {
      margin-top: 30px;
      background-color: #333;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
    }

    .floating-logo {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 80px;
      height: auto;
      z-index: 1000;
      opacity: 0.9;
      animation: rotate 6s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }
  </style>
</head>
<body>

  <!-- 🏠 MENÚ PRINCIPAL -->
  <div class="main-menu" id="mainMenu">
    <button onclick="loadSection('programacion')">
      <span style="font-size: 40px;">📅</span><br>
      <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">Ver programación de Cultos</span>
    </button>
    <button onclick="loadSection('info')">
      <span style="font-size: 40px;">📜</span><br>
      <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">Info del templo y Congregación</span>
    </button>
    <button onclick="loadSection('peticiones')">
      <span style="font-size: 40px;">🙏</span><br>
      <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">Peticiones o Necesidad</span>
    </button>
    <button onclick="loadSection('vercultos')">
      <span style="font-size: 40px;">🎞️</span><br>
      <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">Ver cultos o En vivos</span>
    </button>
  </div>

  <!-- 🔁 CONTENEDOR DE SECCIONES CARGADAS -->
  <div id="dynamicSection" class="section"></div>

  <!-- 🔁 FUNCIONES DE CARGA Y NAVEGACIÓN -->
  <script>
    function loadSection(nombre) {
      document.getElementById("mainMenu").style.display = "none";
      const url = `https://dla-tech.github.io/botones/${nombre}.js`;

      // Quitar secciones anteriores
      const section = document.getElementById('dynamicSection');
      section.innerHTML = '';
      section.style.display = 'flex';

      // Cargar script externo
      const script = document.createElement('script');
      script.src = url;
      script.onload = () => console.log(`${nombre}.js cargado`);
      script.onerror = () => section.innerHTML = '<p>Error al cargar la sección</p>';
      document.body.appendChild(script);
    }

    function goBack() {
      document.getElementById("dynamicSection").style.display = "none";
      document.getElementById("mainMenu").style.display = "flex";
    }
  </script>

  <!-- 🌟 LOGO GIRATORIO -->
  <img src="https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/Logo%20de%20la%20iglesia%20PIPJM-2.png" alt="Logo PIPJM" class="floating-logo">

</body>
</html>
