<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Seleccione idioma</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      overflow: hidden;
      background:#fff;
      font-family: Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    body::before {
      content:"";
      position:fixed; inset:0;
      background:#fff;
      z-index:-1;
    }

    .gate {
      position:absolute; inset:0; min-height:100dvh;
      display:flex; flex-direction:column;
      justify-content:center; align-items:center;
      gap:18px; padding:16px;
      text-align:center; background:rgba(0,0,0,.45);
      box-sizing:border-box;
    }

    @supports not (height: 100dvh) {
      .gate { min-height:100vh; }
    }

    .center-logo {
      position: absolute;
      top: calc(45% - 30px);
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(260px, 100vmin, 540px);
      height: auto;
      display:block;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.25));
      z-index: 1;
      pointer-events: none;
      opacity: 0.96;
    }

    .outline {
      color:#0046ff;
      -webkit-text-stroke:1.8px #ffffff;
      paint-order:stroke fill;
      font-weight:700;
      text-shadow:
        2px 0 #fff, -2px 0 #fff,
        0 2px #fff, 0 -2px #fff,
        2px 2px #fff, -2px 2px #fff,
        2px -2px #fff, -2px -2px #fff;
    }

    h1 {
      margin:0;
      font-size:clamp(20px,4.5vw,28px);
    }

    .church-name {
      position: absolute;
      top: 6%;
      width: 90%;
      max-width: 800px;
      text-align: center;
      font-size: clamp(18px, 3.5vw, 26px);
      color: #0046ff;
      -webkit-text-stroke:1.8px #ffffff;
      font-weight:700;
      z-index: 2;
      line-height: 1.3;
      text-shadow:
        2px 0 #fff, -2px 0 #fff,
        0 2px #fff, 0 -2px #fff,
        2px 2px #fff, -2px 2px #fff,
        2px -2px #fff, -2px -2px #fff;
    }

    .btns {
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
      margin-top:10px;
    }

    .btn {
      display:inline-block;
      min-width:140px;
      padding:12px 18px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      text-decoration:none;
      color:#0046ff;
      -webkit-text-stroke:1.4px #fff;
      paint-order:stroke fill;
      background:rgba(255,255,255,.20);
      border:2px solid rgba(255,255,255,.65);
      border-radius:12px;
      backdrop-filter:blur(2px);
      transition:transform .08s ease, background .15s ease;
    }

    .btn:hover { background:rgba(255,255,255,.28); }
    .btn:active { transform:scale(.98); }

    .promo-banner {
      position:absolute;
      top:4%;
      width:92%;
      max-width:780px;
      text-align:center;
      z-index:999;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 25px rgba(0,0,0,0.45);
      background:transparent;
      cursor:pointer;
      transition:transform 0.3s ease;
    }

    .promo-banner img {
      width:100%;
      height:auto;
      max-height:480px;
      object-fit:cover;
      display:block;
      border-radius:20px;
      transition:transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* 🔍 Estado expandido */
    .promo-fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      z-index: 99999 !important;
      background: rgba(0,0,0,0.95) !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .promo-fullscreen img {
      width: auto !important;
      height: 90vh !important;
      max-width: 96vw !important;
      border-radius: 0 !important;
      box-shadow: 0 0 30px rgba(255,255,255,0.3);
    }

    .lower-section {
      position:absolute;
      top:calc(4% + 480px + 10px);
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
      z-index:20;
    }

    @media (max-height:700px) {
      .promo-banner img { max-height:400px; }
      .lower-section { top:calc(4% + 400px + 6px); }
    }
  </style>
</head>
<body>
  <div class="gate">
    <div class="church-name outline">
      Primera Iglesia Pentecostal de Jesucristo de Maunabo, P.R. Inc.
    </div>

    <div class="promo-banner" id="promoBanner"></div>

    <img
      class="center-logo"
      src="https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/Logo%20de%20la%20iglesia%20PIPJM%20(8.5%20x%209%20in)%20(8.5%20x%2011%20in)%20(11%20x%2011%20in).png"
      alt="Logo PIPJM"
    >

    <div class="lower-section">
      <div class="btns">
        <button class="btn outline" onclick="goES()">Español</button>
        <button class="btn outline" onclick="goEN()">English</button>
      </div>
      <h1 class="outline">Seleccione idioma / Select language</h1>
    </div>
  </div>

  <script>
    const promoUrl = "https://cdn.jsdelivr.net/gh/dla-tech/Media-privada@main/image000001.jpeg";
    const promoBanner = document.getElementById("promoBanner");

    if (promoUrl.trim() !== "") {
      promoBanner.innerHTML = '<img src="' + promoUrl + '" alt="Promo PIPJM">';
    } else {
      promoBanner.style.display = "none";
    }

    // 🌌 Efecto de zoom
    promoBanner.addEventListener("click", () => {
      if (!promoBanner.classList.contains("promo-fullscreen")) {
        promoBanner.classList.add("promo-fullscreen");
        document.body.style.overflow = "hidden";
      } else {
        promoBanner.classList.remove("promo-fullscreen");
        document.body.style.overflow = "auto";
      }
    });

    function goES(){ window.location.href = 'es/Index.html'; }
    function goEN(){ window.location.href = 'en/Index.html'; }
  </script>
</body>
</html>
