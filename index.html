<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iglesia</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/IMG_8023.jpeg') no-repeat center center fixed;
      background-size: cover;
    }

    .main-menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .main-menu button {
      font-size: 18px;
      padding: 14px 24px;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      background-color: rgba(0, 0, 0, 0.5);
      border: none;
      font-weight: bold;
      width: 80%;
      max-width: 400px;
      text-align: center;
    }

    #content {
      display: none;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="main-menu" id="mainMenu">
    <button onclick="loadSection('botones/programacion.js')">📅 Ver programación de Cultos</button>
    <button onclick="loadSection('botones/info.js')">📜 Info del templo y Congregación</button>
    <button onclick="loadSection('botones/peticiones.js')">🙏 Peticiones o Necesidad</button>
    <button onclick="loadSection('botones/vercultos.js')">🎞️ Ver cultos o En vivos</button>
  </div>

  <!-- Aquí se cargará el contenido dinámicamente -->
  <div id="content"></div>

  <script>
    function loadSection(url) {
      // Oculta el menú principal
      document.getElementById("mainMenu").style.display = "none";

      // Limpia y muestra el contenedor de contenido
      const contentDiv = document.getElementById("content");
      contentDiv.innerHTML = '';
      contentDiv.style.display = "block";

      // Crea y carga el script dinámicamente
      const script = document.createElement('script');
      script.src = url;
      script.onload = () => {
        console.log(`${url} cargado`);
      };
      script.onerror = () => {
        contentDiv.innerHTML = `<p style="color:red;">Error al cargar el contenido.</p>`;
      };
      document.body.appendChild(script);
    }

    // Función para regresar al menú principal
    function goBackToMenu() {
      document.getElementById("content").style.display = "none";
      document.getElementById("mainMenu").style.display = "flex";
    }
  </script>

</body>
</html>
