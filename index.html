<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Iglesia</title>
  <style>
    :root{
      /* el fondo “pesado” se inyecta aquí cuando cargue */
      --bg-img: none;
    }

    /* Fondo base ultrarápido (color + degradado), y luego se suma var(--bg-img) */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: Arial, sans-serif;

      /* Primero pinta el degradado ligero, y cuando cargue la imagen se añade encima */
      background:
        radial-gradient(60% 60% at 50% 40%, rgba(0,0,0,0.35), rgba(0,0,0,0.7)),
        #000,
        var(--bg-img);
      background-repeat: no-repeat, no-repeat, no-repeat;
      background-position: center center, center center, center center;
      background-attachment: scroll, scroll, fixed; /* el fondo grande queda fixed */
      background-size: cover, cover, cover;
    }

    /* inputs con 16px para evitar zoom iOS */
    #content input,
    #content textarea,
    #content select,
    #content button { font-size: 16px; }

    /* Gate de idioma */
    .lang-gate {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 22px;
      background-color: rgba(0,0,0,0.55);
      text-align: center;
    }
    .lang-gate h2 {
      margin: 0 20px 6px 20px;
      font-size: 22px;
      color: #fff;
      text-shadow:
        1px 0 #fff, -1px 0 #fff, 0 1px #fff, 0 -1px #fff,
        1px 1px #fff, -1px 1px #fff, 1px -1px #fff, -1px -1px #fff;
    }
    .lang-gate .lang-buttons { display: flex; gap: 14px; }
    .lang-gate .lang-buttons button {
      font-size: 16px; padding: 12px 18px; border-radius: 10px;
      color: #fff; background: rgba(0,0,0,.55); border: 0; font-weight: 700; cursor: pointer;
    }

    /* Menú principal */
    .main-menu {
      position: absolute; inset: 0;
      width: 100vw; height: 100dvh;
      display: none; /* se muestra tras elegir idioma */
      flex-direction: column; justify-content: center; align-items: center;
      gap: 22px; text-align: center;
      background-color: rgba(0,0,0,0.5);
    }

    /* Nombre del templo: azul oscuro + contorno blanco (offset 100%) */
    .church-name {
      color: #0b2e74;
      font-size: 18px;
      font-weight: 700;
      margin: 0 16px 8px 16px;
      line-height: 1.35;
      text-align: center;
      text-shadow:
        1px 0 #fff, -1px 0 #fff, 0 1px #fff, 0 -1px #fff,
        1px 1px #fff, -1px 1px #fff, 1px -1px #fff, -1px -1px #fff;
    }

    .main-menu button {
      font-size: 16px;
      padding: 14px 22px;
      border-radius: 12px;
      color: #fff;
      background-color: rgba(0,0,0,0.5);
      border: none;
      font-weight: bold;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; text-align: center; cursor: pointer;
    }

    /* Logo flotante (carga diferida) */
    .floating-logo {
      position: fixed; bottom: 20px; right: 20px;
      width: 80px; height: auto; z-index: 1000; opacity: .9;
      animation: rotate 6s linear infinite;
      pointer-events: none;
    }
    @keyframes rotate { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
  </style>
</head>
<body>

  <!-- Selector de idioma -->
  <div id="langGate" class="lang-gate">
    <h2>Seleccione idioma / Select language</h2>
    <div class="lang-buttons">
      <button onclick="chooseLang('es')">Español</button>
      <button onclick="chooseLang('en')">English</button>
    </div>
  </div>

  <!-- Menú principal (se rellena según idioma) -->
  <div class="main-menu" id="mainMenu"></div>

  <!-- Zona de carga de JS -->
  <div id="content" style="display:none;"></div>

  <script>
    /* === CARGA DIFERIDA DEL FONDO PESADO === */
    (function lazyBackground(){
      const full = 'https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/IMG_8023.jpeg';
      const img = new Image();
      img.decoding = 'async';
      img.fetchPriority = 'low';
      img.onload = function(){
        document.documentElement.style.setProperty('--bg-img', `url('${full}')`);
      };
      // dispara la carga tras el primer frame para no bloquear el render inicial
      (window.requestIdleCallback || window.requestAnimationFrame || setTimeout)(() => { img.src = full; }, 0);
    })();

    /* === MULTI-IDIOMA (igual que antes) === */
    const BASES = {
      es: 'https://dla-tech.github.io/PIPJM-PUBLIC-WE-/botones/',
      en: 'https://dla-tech.github.io/PIPJM-PUBLIC-WE-/botones_en/'
    };
    const FILES = {
      es: { programacion:'programacion.js', info:'info.js', peticiones:'peticiones.js', vercultos:'vercultos.js' },
      en: { programacion:'programacion_en.js', info:'info_en.js', peticiones:'peticiones_en.js', vercultos:'vercultos_en.js' }
    };
    const LABELS = {
      es: {
        churchName:'Primera Iglesia Pentecostal de Jesucristo de Maunabo, P.R. Inc',
        programacion:'Ver programación de Cultos',
        info:'Info del templo y Congregación',
        peticiones:'Peticiones o Necesidad',
        vercultos:'Ver cultos o En vivos',
        icons:['📅','📜','🙏','🎞️']
      },
      en: {
        churchName:'First Pentecostal Church of Jesus Christ of Maunabo, P.R. Inc.',
        programacion:'View Service Schedule',
        info:'Temple & Congregation Info',
        peticiones:'Prayer Requests',
        vercultos:'Watch Services & Live',
        icons:['📅','📜','🙏','🎞️']
      }
    };

    let currentLang = null;

    function chooseLang(lang) {
      currentLang = lang;
      document.getElementById('langGate').style.display = 'none';
      buildMainMenu(lang);
      document.getElementById('mainMenu').style.display = 'flex';
    }

    function buildMainMenu(lang) {
      const L = LABELS[lang];
      const mm = document.getElementById('mainMenu');
      mm.innerHTML = `
        <div class="church-name">${L.churchName}</div>

        <button onclick="loadScript('programacion')">
          <span style="font-size: 40px;">${L.icons[0]}</span><br>
          <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">${L.programacion}</span>
        </button>

        <button onclick="loadScript('info')">
          <span style="font-size: 40px;">${L.icons[1]}</span><br>
          <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">${L.info}</span>
        </button>

        <button onclick="loadScript('peticiones')">
          <span style="font-size: 40px;">${L.icons[2]}</span><br>
          <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">${L.peticiones}</span>
        </button>

        <button onclick="loadScript('vercultos')">
          <span style="font-size: 40px;">${L.icons[3]}</span><br>
          <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">${L.vercultos}</span>
        </button>
      `;
    }

    function loadScript(key) {
      const content = document.getElementById("content");
      const mainMenu = document.getElementById("mainMenu");
      mainMenu.style.display = "none";
      content.style.display = "block";
      content.innerHTML = "";
      const base = BASES[currentLang];
      const file = FILES[currentLang][key];
      const script = document.createElement('script');
      script.src = base + file;
      script.type = 'text/javascript';
      document.body.appendChild(script);
    }

    function volverAlMenu() {
      const content = document.getElementById("content");
      const mainMenu = document.getElementById("mainMenu");
      content.style.display = "none";
      content.innerHTML = "";
      mainMenu.style.display = "flex";
    }
  </script>

  <!-- Logo flotante (carga diferida) -->
  <img
    src="https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/Logo%20de%20la%20iglesia%20PIPJM-2.png"
    alt="Logo PIPJM"
    class="floating-logo"
    loading="lazy"
    decoding="async"
    fetchpriority="low"
  />
</body>
</html>
