<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Iglesia</title>
  <style>
    /* Base y fondo (solución anti-bordes en iOS) */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      height: 100%;
      min-height: 100dvh;
      background: #000; /* color de seguridad detrás del fondo */
      overscroll-behavior: none;
    }
    /* Fondo en pseudo-elemento fijo (mejor que background:fixed en iOS) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/IMG_8023.jpeg') no-repeat center center;
      background-size: cover;
      z-index: -1;
      transform: translateZ(0);
    }
    /* Fallback para iOS antiguo */
    @supports (-webkit-touch-callout: none) {
      html, body { height: -webkit-fill-available; }
    }

    /* Evitar zoom en iOS al enfocar inputs */
    #content input,
    #content textarea,
    #content select,
    #content button {
      font-size: 16px;
    }

    /* Gate de idioma: a pantalla completa y fijo */
    .lang-gate {
      position: fixed;
      inset: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 22px;
      background-color: rgba(0,0,0,0.55);
    }
    .lang-gate h2 {
      margin: 0 20px 6px 20px;
      text-align: center;
      font-size: 22px;
      color: #fff;
      text-shadow:
        1px 0 #fff, -1px 0 #fff, 0 1px #fff, 0 -1px #fff,
        1px 1px #fff, -1px 1px #fff, 1px -1px #fff, -1px -1px #fff;
    }
    .lang-gate .lang-buttons {
      display: flex;
      gap: 14px;
    }
    .lang-gate .lang-buttons button {
      font-size: 16px;
      padding: 12px 18px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      background-color: rgba(0, 0, 0, 0.55);
      border: none;
      font-weight: bold;
    }

    /* Menú principal a pantalla completa y fijo */
    .main-menu {
      position: fixed;
      inset: 0;
      min-height: 100dvh;
      width: 100vw;
      display: none; /* oculto hasta elegir idioma */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 22px;
      background-color: rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    /* Nombre del templo (azul oscuro con contorno blanco) */
    .church-name {
      color: #0b2e74;
      font-size: 18px;
      font-weight: 700;
      margin: 0 16px 8px 16px;
      line-height: 1.35;
      text-align: center;
      text-shadow:
        1px 0 #fff, -1px 0 #fff, 0 1px #fff, 0 -1px #fff,
        1px 1px #fff, -1px 1px #fff, 1px -1px #fff, -1px -1px #fff;
    }

    .main-menu button {
      font-size: 16px;
      padding: 14px 22px; /* un poco más pequeños */
      border-radius: 12px;
      color: white;
      cursor: pointer;
      background-color: rgba(0, 0, 0, 0.5);
      border: none;
      font-weight: bold;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
    }

    /* Logo flotante */
    .floating-logo {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 80px;
      height: auto;
      z-index: 1000;
      opacity: 0.9;
      animation: rotate 6s linear infinite;
      pointer-events: none;
    }
    @keyframes rotate {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }
  </style>
</head>
<body>

  <!-- Selector de idioma -->
  <div id="langGate" class="lang-gate">
    <h2>Seleccione idioma / Select language</h2>
    <div class="lang-buttons">
      <button onclick="chooseLang('es')">Español</button>
      <button onclick="chooseLang('en')">English</button>
    </div>
  </div>

  <!-- MENÚ PRINCIPAL (se llena según idioma) -->
  <div class="main-menu" id="mainMenu"></div>

  <!-- ÁREA PARA CARGAR LOS ARCHIVOS .JS -->
  <div id="content" style="display: none;"></div>

  <!-- SCRIPTS -->
  <script>
    // Directorios base por idioma
    const BASES = {
      es: 'https://dla-tech.github.io/PIPJM-PUBLIC-WE-/botones/',
      en: 'https://dla-tech.github.io/PIPJM-PUBLIC-WE-/botones_en/'
    };

    // Archivos por idioma
    const FILES = {
      es: {
        programacion: 'programacion.js',
        info: 'info.js',
        peticiones: 'peticiones.js',
        vercultos: 'vercultos.js'
      },
      en: {
        programacion: 'programacion_en.js',
        info: 'info_en.js',
        peticiones: 'peticiones_en.js',
        vercultos: 'vercultos_en.js'
      }
    };

    // Etiquetas por idioma
    const LABELS = {
      es: {
        churchName: 'Primera Iglesia Pentecostal de Jesucristo de Maunabo, P.R. Inc',
        programacion: 'Ver programación de Cultos',
        info: 'Info del templo y Congregación',
        peticiones: 'Peticiones o Necesidad',
        vercultos: 'Ver cultos o En vivos',
        icons: ['📅','📜','🙏','🎞️']
      },
      en: {
        churchName: 'First Pentecostal Church of Jesus Christ of Maunabo, P.R. Inc.',
        programacion: 'View Service Schedule',
        info: 'Temple & Congregation Info',
        peticiones: 'Prayer Requests',
        vercultos: 'Watch Services & Live',
        icons: ['📅','📜','🙏','🎞️']
      }
    };

    let currentLang = null;

    function chooseLang(lang) {
      currentLang = lang;
      document.getElementById('langGate').style.display = 'none';
      buildMainMenu(lang);
      document.getElementById('mainMenu').style.display = 'flex';

      // Idioma del documento
      document.documentElement.setAttribute('lang', lang === 'es' ? 'es' : 'en');
      document.title = lang === 'es' ? 'Iglesia' : 'Church';
    }

    function buildMainMenu(lang) {
      const L = LABELS[lang];
      const mm = document.getElementById('mainMenu');

      mm.innerHTML = `
        <div class="church-name">${L.churchName}</div>

        <button onclick="loadScript('programacion')">
          <span style="font-size: 40px;">${L.icons[0]}</span><br>
          <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">${L.programacion}</span>
        </button>

        <button onclick="loadScript('info')">
          <span style="font-size: 40px;">${L.icons[1]}</span><br>
          <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">${L.info}</span>
        </button>

        <button onclick="loadScript('peticiones')">
          <span style="font-size: 40px;">${L.icons[2]}</span><br>
          <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">${L.peticiones}</span>
        </button>

        <button onclick="loadScript('vercultos')">
          <span style="font-size: 40px;">${L.icons[3]}</span><br>
          <span style="font-size: 18px; color: white; text-shadow: 1px 1px 3px black;">${L.vercultos}</span>
        </button>
      `;
    }

    function loadScript(key) {
      const content = document.getElementById("content");
      const mainMenu = document.getElementById("mainMenu");

      mainMenu.style.display = "none";
      content.style.display = "block";
      content.innerHTML = ""; // limpiar antes

      const base = BASES[currentLang];
      const file = FILES[currentLang][key];

      const script = document.createElement('script');
      script.src = base + file;
      script.type = 'text/javascript';
      document.body.appendChild(script);
    }

    // Usado por los .js externos para volver al menú (en el idioma elegido)
    function volverAlMenu() {
      const content = document.getElementById("content");
      const mainMenu = document.getElementById("mainMenu");
      content.style.display = "none";
      content.innerHTML = "";
      mainMenu.style.display = "flex";
    }
  </script>

  <!-- LOGO GIRATORIO -->
  <img
    src="https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/Logo%20de%20la%20iglesia%20PIPJM-2.png"
    alt="Logo PIPJM"
    class="floating-logo"
  />
</body>
</html>
