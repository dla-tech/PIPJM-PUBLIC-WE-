<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seleccione idioma</title>
  <style>
    /* Base y fondo a pantalla completa (sin barras blancas) */
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
      overscroll-behavior: none;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('https://raw.githubusercontent.com/dla-tech/Media-privada/refs/heads/main/IMG_8023.jpeg')
                  center / cover no-repeat;
      z-index: -1;
    }

    /* Contenedor centrado */
    .gate {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      position: relative;
    }
    @supports not (height: 100dvh) {
      .gate { min-height: 100vh; }
    }
    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 24px 20px;
      background: rgba(255,255,255,0.12); /* muy liviano, solo para contraste */
      border-radius: 16px;
      backdrop-filter: blur(2px);
    }

    /* Texto negro con offset/blanco 100% (contorno) */
    .title, .btn {
      color: #000;
      -webkit-text-stroke: 1.6px #fff; /* contorno blanco sólido */
      paint-order: stroke fill;
      text-align: center;
      letter-spacing: 0.2px;
    }
    /* Fallback si no hay text-stroke */
    @supports not (-webkit-text-stroke: 1px #fff) {
      .title, .btn {
        text-shadow:
          1px 0 #fff, -1px 0 #fff, 0 1px #fff, 0 -1px #fff,
          1px 1px #fff, -1px 1px #fff, 1px -1px #fff, -1px -1px #fff;
      }
    }

    .title {
      margin: 0 12px 6px;
      font-size: clamp(20px, 4.5vw, 28px);
      font-weight: 800;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0 10px 8px;
      font-size: clamp(16px, 3.8vw, 20px);
      font-weight: 700;
      color: #000;
      -webkit-text-stroke: 1.4px #fff;
      paint-order: stroke fill;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      font: inherit;
      font-weight: 800;
      font-size: clamp(16px, 3.8vw, 20px);
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.7);
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      user-select: none;
      transition: transform .08s ease;
    }
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="gate">
    <div class="panel">
      <div class="title">Seleccione idioma / Select language</div>
      <div class="subtitle">Elija una opción</div>
      <div class="buttons">
        <button class="btn" onclick="go('es')">Español</button>
        <button class="btn" onclick="go('en')">English</button>
      </div>
    </div>
  </div>

  <script>
    /* Ajusta estas rutas si cambias tu estructura */
    const ES_URL = './';                // Español en la raíz
    const EN_URL = './en/Index.html';   // Inglés en /en/Index.html (I mayúscula)

    function go(lang) {
      location.href = (lang === 'es') ? ES_URL : EN_URL;
    }
  </script>
</body>
</html>
